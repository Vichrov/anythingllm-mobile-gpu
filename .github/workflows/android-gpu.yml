name: Android GPU APK
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        backend: [opencl, vulkan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Vulkan SDK cache
        if: matrix.backend == 'vulkan'
        uses: actions/cache@v4
        id: vulkan-sdk
        with:
          path: build/vulkan-sdk
          key: vulkan-sdk-linux-1.4.363.1
      - name: Download pinned Vulkan SDK
        if: matrix.backend == 'vulkan' && steps.vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/vulkan-sdk
          curl -fL --retry 3 https://sdk.lunarg.com/sdk/download/1.4.363.1/linux/vulkan_sdk.tar.xz | tar -xJ --strip-components=1 -C build/vulkan-sdk
      - name: Restore Vulkan native library
        if: matrix.backend == 'vulkan'
        uses: actions/cache/restore@v4
        id: vulkan-native
        with:
          path: build/vulkan-prebuilt
          key: vulkan-native-api28-${{ hashFiles('scripts/vulkan/**', 'patches/llama.rn+0.12.9.patch', 'yarn.lock') }}
      - name: Restore and build Vulkan backend
        if: matrix.backend == 'vulkan'
        run: |
          export VULKAN_SDK="$GITHUB_WORKSPACE/build/vulkan-sdk/x86_64"
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib:${LD_LIBRARY_PATH:-}"
          git init "$RUNNER_TEMP/llama-upstream"
          git -C "$RUNNER_TEMP/llama-upstream" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama-upstream" fetch --depth 1 origin 6c8dcaa7ae41fa9f4aa2b3b68ee82cb8b2a03632
          git -C "$RUNNER_TEMP/llama-upstream" checkout FETCH_HEAD
          python3 scripts/vulkan/prepare.py "$RUNNER_TEMP/llama-upstream"
          bash scripts/vulkan/build.sh
      - name: Cache Vulkan native library
        if: matrix.backend == 'vulkan' && steps.vulkan-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vulkan-prebuilt
          key: ${{ steps.vulkan-native.outputs.cache-primary-key }}
      - name: Test GPU configuration
        run: yarn jest src/utils/inference/__tests__/config.test.ts --runInBand
      - name: Type check
        run: yarn typecheck
      - name: Build standalone ARM64 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify native backend and bundle
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY'
          import os, zipfile
          suffix = 'vulkan' if os.environ['BACKEND'] == 'vulkan' else 'hexagon_opencl'
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk') as z:
            for prefix in ('librnllama_', 'librnllama_jni_'):
              name = f'lib/arm64-v8a/{prefix}v8_2_dotprod_i8mm_{suffix}.so'
              assert name in z.namelist(), name + ' missing'
            if suffix == 'vulkan':
              assert not any('hexagon_opencl' in n for n in z.namelist()), 'Unexpected OpenCL fallback'
            assert 'assets/index.android.bundle' in z.namelist()
          PY
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/AnythingLLM-v0.1.1-${BACKEND}-arm64.apk"
          cd release && sha256sum *.apk > "SHA256SUMS-${BACKEND}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.backend }}
          path: release/*
  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: release
      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.1-gpu.${{ github.run_number }}"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "AnythingLLM 0.1.1 — Vulkan / OpenCL" --notes-file GPU_RELEASE_NOTES.md
